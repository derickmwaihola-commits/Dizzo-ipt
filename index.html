<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIZZO IPT AI - NIT BBA - FREE APK</title><script src="https://cdn.tailwindcss.com"></script><style>@media print{.no-print{display:none}}</style></head><body class="bg-slate-100"><div class="bg-blue-800 text-white p-3 flex justify-between items-center sticky top-0 z-50 no-print"><b>DIZZO IPT AI</b><div class="flex gap-2"><button onclick="setLang('en')" id="bEN" class="bg-white text-blue-800 px-2 py-1 rounded text-xs font-bold">EN</button><button onclick="setLang('sw')" id="bSW" class="bg-yellow-300 text-black px-2 py-1 rounded text-xs font-bold">SW</button><button onclick="window.print()" class="bg-green-400 text-black px-2 py-1 rounded text-xs font-bold">PDF</button></div></div><div class="max-w-5xl mx-auto grid lg:grid-cols-2"><div class="bg-white p-3 space-y-2 no-print"><input id="reg" placeholder="Reg No: NIT/BBA/..." class="w-full border p-2 rounded text-sm"><input id="name" placeholder="Jina Kamili" class="w-full border p-2 rounded text-sm"><input id="place" placeholder="Place: TRA, TANESCO, NBC" class="w-full border p-2 rounded text-sm font-bold"><select id="workDept" class="w-full border p-2 rounded text-sm"><option>Finance / Accounts</option><option>Human Resource (HRM)</option><option>Marketing & Sales</option><option>Procurement & Supplies</option><option>General Administration</option><option>Customer Service</option></select><button onclick="aiAll()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 rounded-lg font-bold">AI TENGENEZA REPORT YOTE (BILINGUAL)</button><div class="grid grid-cols-3 gap-1"><button onclick="aiChapter1()" class="bg-blue-700 text-white py-2 rounded text-xs font-bold">Ch1</button><button onclick="aiChapter2()" class="bg-indigo-700 text-white py-2 rounded text-xs font-bold">Ch2</button><button onclick="aiChapter3()" class="bg-green-700 text-white py-2 rounded text-xs font-bold">Ch3</button></div><textarea id="ch1_bg" rows="4" class="w-full border p-2 rounded text-sm" placeholder="1.1 Background"></textarea><textarea id="actRaw" rows="5" class="w-full border p-2 rounded text-sm" placeholder="Activities"></textarea><textarea id="conc" rows="3" class="w-full border p-2 rounded text-sm" placeholder="Conclusion"></textarea><textarea id="reco" rows="3" class="w-full border p-2 rounded text-sm" placeholder="Recommendations"></textarea><button onclick="build()" class="w-full bg-black text-white py-2 rounded font-bold">Preview</button></div><div class="bg-gray-200 p-2"><div id="paper" class="bg-white p-6 text-[12px] leading-relaxed text-black" style="font-family:'Times New Roman',serif"><div class="text-center"><h1 class="font-bold">NIT - BUSINESS ADMINISTRATION</h1><h2 class="font-bold uppercase mt-4">IPT REPORT - ILCGP/04</h2><p class="text-xs mt-2"><span id="ppReg"></span> | <span id="ppName"></span> | <span id="ppPlace"></span></p></div><p id="p_bg" class="mt-4 text-justify"></p><p id="p_act" class="mt-4 whitespace-pre-wrap"></p><p id="p_conc" class="mt-4"></p><p id="p_reco" class="mt-2 whitespace-pre-wrap"></p></div></div></div><script>let lang='en';function setLang(l){lang=l;document.getElementById('bEN').style.background=l==='en'?'white':'#ddd';document.getElementById('bSW').style.background=l==='sw'?'#facc15':'#ddd';}function g(id){return document.getElementById(id).value.trim();}function s(id,v){document.getElementById(id).value=v;}function aiChapter1(){const p=g('place')||'TRA';const d=g('workDept');if(lang==='en'){s('ch1_bg',p+' is a reputable public institution in Tanzania. It has departments including '+d+', Finance, HR and Operations. During my IPT at '+p+' I was attached to '+d+' to apply Business Administration theories.');}else{s('ch1_bg',p+' ni taasisi maarufu Tanzania. Ina idara za '+d+', Fedha, HR. Wakati wa IPT nilipangwa '+d+' kujifunza vitendo.');}build();}function aiChapter2(){const d=g('workDept');const en={'Finance / Accounts':'Recording transactions, vouchers, reconciliation, filing, Excel','Human Resource (HRM)':'Filing employee files, attendance, leave, recruitment docs','Marketing & Sales':'Customer service, inquiries, campaigns, surveys','Procurement & Supplies':'LPO, receiving goods, store management, tender','General Administration':'Mail, filing, meetings, office management','Customer Service':'Customer reception, complaints, feedback'};const sw={'Finance / Accounts':'Kuandika miamala, vouchers, maridhiano, filing','Human Resource (HRM)':'Kuhifadhi mafaili ya watumishi, mahudhurio','Marketing & Sales':'Kuhudumia wateja, kampeni, utafiti','Procurement & Supplies':'LPO, kupokea bidhaa, stoo','General Administration':'Barua, filing, mikutano','Customer Service':'Mapokezi, malalamiko'};if(lang==='en')s('actRaw',en[d]||en['General Administration']);else s('actRaw',sw[d]||sw['General Administration']);build();}function aiChapter3(){if(lang==='en'){s('conc','IPT was very beneficial for Business Administration student, I gained practical skills.');s('reco','NIT should continue IPT, organization should provide more tools, students should be proactive.');}else{s('conc','IPT ilikuwa na manufaa makubwa, nilipata ujuzi wa vitendo.');s('reco','NIT iendelee na IPT, mashirika yatoe vifaa zaidi, wanafunzi wawe wachapakazi.');}build();}function aiAll(){aiChapter1();aiChapter2();aiChapter3();}function build(){document.getElementById('ppReg').innerText=g('reg');document.getElementById('ppName').innerText=g('name');document.getElementById('ppPlace').innerText=g('place');document.getElementById('p_bg').innerText=g('ch1_bg');document.getElementById('p_act').innerText=g('actRaw');document.getElementById('p_conc').innerText=g('conc');document.getElementById('p_reco').innerText=g('reco');}</script></body></html>
